# Serves the static frontend and reverse-proxies /api/* to the real
# FastAPI service, so the browser sees everything as one origin —
# matching ApiClient's default baseUrl ("/api") with zero
# configuration and no CORS requirement for this docker-compose path.
# CORS (configured in api/main.py) remains available for anyone
# calling the API directly cross-origin (e.g. local dev without
# Docker, or a separately-hosted frontend) — not needed here, not
# removed either.
#
# The image built from frontend/Dockerfile only ever contains
# index.html and src/ — nginx.conf and tests/ are never copied in, so
# they cannot be served regardless of the rules below. The explicit
# deny rules here are defense-in-depth only, for the case someone
# reverts to a raw directory bind-mount for local hot-reload
# convenience (documented as a dev-only alternative in DEPLOYMENT.md,
# never the shipped default) — found necessary during the Phase 7
# audit, which is exactly the scenario that made nginx.conf itself
# publicly fetchable before this fix.
server {
    listen 80;

    # Security headers (Phase 7, Step 6 — found entirely absent before
    # this audit). Conservative defaults appropriate for a same-origin,
    # no-inline-script static app; tighten further (e.g. a stricter CSP
    # allowing only this origin) once real deployment specifics
    # (any CDN, any third-party embed) are known.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Defense-in-depth: never serve dotfiles, the nginx config itself,
    # or a tests/ directory, even if a future change reintroduces a
    # broader bind mount than the Dockerfile's explicit COPY list.
    location ~ /\. { deny all; }
    location = /nginx.conf { deny all; }
    location ^~ /tests/ { deny all; }

    # Evidence uploads (once the evidence-upload page is built — see
    # docs/frontend-runtime-verification.md's "not yet built" list) go
    # through this same proxy; sized generously but not unbounded.
    client_max_body_size 25m;

    location /api/ {
        # Strips the /api prefix before forwarding, since the FastAPI
        # app's own routes have no /api prefix themselves (see
        # src/asavexa/api/main.py's include_router calls).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generous but bounded — long enough for a real report/export
        # to compute, short enough that a hung upstream doesn't tie up
        # a worker connection indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
