# Alembic configuration for ASAVEXA.
#
# NOT executed in the sandbox that produced this codebase — `alembic`
# cannot be installed (no network access, no cached wheel). Written by
# hand, following Alembic's standard generated layout exactly, so that
# `alembic upgrade head` works unmodified once the package is
# installable. See docs/postgresql-runtime-verification.md.

[alembic]
script_location = migrations

# The real URL is read from the DATABASE_URL environment variable at
# runtime by migrations/env.py — never hardcoded here, and never
# committed with real credentials. This line is Alembic's required
# fallback only; env.py overrides it before any real connection is made.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
